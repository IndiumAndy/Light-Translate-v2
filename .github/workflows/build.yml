name: Build & Release Cross-Platform Bundles

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Prepare a signed macOS build without publishing a Release
        type: boolean
        default: false
      submit_new:
        description: Upload one new Apple submission. Leave false to avoid another upload.
        type: boolean
        default: false
      submission_ids:
        description: Comma-separated Apple submission IDs to query. Used only when submit_new is false.
        type: string
        default: "6f3e89b3-a007-488a-8169-934e4538ff3c,fead72bc-32cd-448d-b2b6-b10d8aa4ec98,50da0ca2-671e-4892-918b-afc1aff406b2,3b568336-28a8-47d3-9f03-163bfa12d74e,1d0948ba-9674-46fd-8b9d-6ae23104b59e"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-core:
    name: Rust Core Tests & Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test macOS release safeguards
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Install Linux Tauri system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - name: Install frontend dependencies & verify build
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  query-saved-notary:
    name: Query saved Apple submissions
    needs: test-core
    if: github.event_name == 'workflow_dispatch' && inputs.sign_macos && !inputs.submit_new
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read notarization status without uploading
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_QUERY_IDS: ${{ inputs.submission_ids }}
          LT_NOTARY_MAX_POLLS: "1"
        run: python3 scripts/notarize_macos.py --query-only

  build-bundles:
    name: Build (${{ matrix.os_label }})
    needs: test-core
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.sign_macos && !inputs.submit_new) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os_label: macos
            tauri_args: "--target universal-apple-darwin --bundles dmg"
          - platform: windows-latest
            os_label: windows
            tauri_args: "--bundles nsis,msi"
          - platform: ubuntu-22.04
            os_label: linux
            tauri_args: "--bundles deb,rpm,appimage"
    runs-on: ${{ matrix.platform }}
    env:
      SIGN_MACOS: ${{ matrix.os_label == 'macos' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.sign_macos && inputs.submit_new)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Developer ID signing for official macOS releases
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: bash scripts/setup-macos-ci-signing.sh

      - name: Install Linux dependencies
        if: matrix.os_label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev file

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.os_label == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Tauri platform bundles
        if: env.SIGN_MACOS != 'true'
        run: pnpm tauri build ${{ matrix.tauri_args }}

      - name: Build, sign and notarize official macOS application
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: bash scripts/build-macos-release.sh

      - name: Notarize and verify the downloadable macOS installer
        if: env.SIGN_MACOS == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          shopt -s nullglob
          installers=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#installers[@]}" -eq 1
          bash scripts/notarize-macos-dmg.sh "${installers[0]}"

      - name: Normalize macOS installer filename
        if: matrix.os_label == 'macos'
        shell: bash
        run: |
          mkdir -p release-assets
          DMG_FILE=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name "*.dmg" | head -n 1)
          test -n "$DMG_FILE"
          cp "$DMG_FILE" release-assets/LightTranslate-macOS-Universal.dmg
          ls -lh release-assets

      - name: Normalize Windows installer filenames
        if: matrix.os_label == 'windows'
        shell: bash
        run: |
          mkdir -p release-assets
          EXE_FILE=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name "*-setup.exe" | head -n 1)
          MSI_FILE=$(find src-tauri/target/release/bundle/msi -maxdepth 1 -name "*.msi" | head -n 1)
          test -n "$EXE_FILE"
          test -n "$MSI_FILE"
          cp "$EXE_FILE" release-assets/LightTranslate-Windows-x64-setup.exe
          cp "$MSI_FILE" release-assets/LightTranslate-Windows-x64.msi
          ls -lh release-assets

      - name: Normalize Linux package filenames
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          mkdir -p release-assets
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name "*.deb" | head -n 1)
          APPIMAGE_FILE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" | head -n 1)
          RPM_FILE=$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name "*.rpm" | head -n 1)
          test -n "$DEB_FILE"
          test -n "$APPIMAGE_FILE"
          test -n "$RPM_FILE"
          cp "$DEB_FILE" release-assets/LightTranslate-Linux-x86_64.deb
          cp "$APPIMAGE_FILE" release-assets/LightTranslate-Linux-x86_64.AppImage
          cp "$RPM_FILE" release-assets/LightTranslate-Linux-x86_64.rpm
          ls -lh release-assets

      - name: Upload OS-labeled release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os_label }}
          path: release-assets/*
          if-no-files-found: error

      - name: Preserve signed DMG when Apple processing or verification fails
        if: failure() && env.SIGN_MACOS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-notarization-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.notarization.json
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.zip
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.notarization.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary macOS signing keychain
        if: always() && env.SIGN_MACOS == 'true'
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/lighttranslate-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  publish-release:
    name: Publish Cross-Platform GitHub Release
    needs: build-bundles
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all OS release artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected-assets
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256 checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          test "$GITHUB_REF_NAME" = "$TAG"
          cd collected-assets
          sha256sum LightTranslate-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          cat <<EOF > release-notes.md
          ## Light Translate ${TAG} — 跨平台安装包下载

          请根据你当前使用的操作系统选择对应前缀的安装包（文件名已按 \`macOS\` / \`Windows\` / \`Linux\` 严格区分）：

          | 操作系统 | 适用架构 / 发行版 | 推荐下载文件 |
          | :--- | :--- | :--- |
          | **macOS 14.0+** | Apple Silicon (M1–M4) & Intel 通用 | \`LightTranslate-macOS-Universal.dmg\` |
          | **Windows 10 / 11** | 64 位个人桌面安装向导（推荐） | \`LightTranslate-Windows-x64-setup.exe\` |
          | **Windows 10 / 11** | 64 位企业 / 静默部署包 | \`LightTranslate-Windows-x64.msi\` |
          | **Linux (X11)** | Ubuntu / Debian / Mint (x86_64) | \`LightTranslate-Linux-x86_64.deb\` |
          | **Linux (X11)** | 免安装单文件通用版 (x86_64) | \`LightTranslate-Linux-x86_64.AppImage\` |
          | **Linux (X11)** | Fedora / RHEL / openSUSE (x86_64) | \`LightTranslate-Linux-x86_64.rpm\` |

          macOS 安装包及应用均已通过 Developer ID 签名、Apple 公证和 Gatekeeper 校验。将应用拖入「应用程序」后启动，按系统提示授予辅助功能和屏幕录制权限。

          > 校验值请参考附件中的 \`SHA256SUMS.txt\`。各平台详细安装说明见仓库 [README.md](https://github.com/${{ github.repository }}#下载与安装macos--windows--linux)。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; publish a new version instead of replacing its assets." >&2
            exit 1
          else
            gh release create "$TAG" LightTranslate-* SHA256SUMS.txt \
              --target "${{ github.sha }}" \
              --title "Light Translate ${TAG}" \
              --notes-file release-notes.md \
              --latest
          fi
